name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build redirect page
        run: |
          mkdir -p pages-redirect
          cat > pages-redirect/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=https://duice-xuanfan.pages.dev/">
            <link rel="canonical" href="https://duice-xuanfan.pages.dev/">
            <title>对策选饭</title>
          </head>
          <body>
            <p>正在打开对策选饭。<a href="https://duice-xuanfan.pages.dev/">点击直接访问</a></p>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-redirect
      - uses: actions/deploy-pages@v4
        id: deployment
