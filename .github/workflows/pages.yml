name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.CANTEEN_API_ORIGIN != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Configure Worker API
        env:
          API_ORIGIN: ${{ vars.CANTEEN_API_ORIGIN }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const url = new URL(process.env.API_ORIGIN);
          if (url.protocol !== 'https:' || url.href !== url.origin + '/') {
            throw new Error('CANTEEN_API_ORIGIN must be an HTTPS origin');
          }
          writeFileSync('canteen_frontend/config.js', 'window.CANTEEN_API_ORIGIN = ' + JSON.stringify(url.origin) + ';\n');
          JS
      - uses: actions/upload-pages-artifact@v4
        with:
          path: canteen_frontend
      - uses: actions/deploy-pages@v4
        id: deployment
